services:
  # Python FastAPI AI Vision & Background Removal Service
  - type: web
    name: nova-ai-fastapi
    runtime: python
    region: oregon
    plan: free
    rootDir: server_ai
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: PUBLIC_AI_URL
        generateValue: false

  # Primary Node.js Express Backend Service
  - type: web
    name: nova-backend
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: AI_BACKEND_URL
        fromService:
          name: nova-ai-fastapi
          type: web
          property: host

