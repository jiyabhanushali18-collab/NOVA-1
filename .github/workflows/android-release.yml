name: Android Production Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release version (for example 1.0.1)'
        required: true
        default: '1.0.1'
      version_code:
        description: 'Android versionCode (must be greater than the last release)'
        required: true
        default: '2'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    env:
      CI: true
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      APP_VERSION_NAME: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version_name || github.ref_name != '' && github.ref_name }}
      APP_VERSION_CODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version_code || 2 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version metadata
        id: version_meta
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION_NAME="${{ github.event.inputs.version_name }}"
            VERSION_CODE="${{ github.event.inputs.version_code }}"
            TAG="v${VERSION_NAME}"
          else
            VERSION_NAME="${GITHUB_REF_NAME#v}"
            VERSION_CODE="${VERSION_CODE:-2}"
            TAG="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid semantic version: $VERSION_NAME" >&2
            exit 1
          fi

          if ! [[ "$VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "Invalid Android versionCode: $VERSION_CODE" >&2
            exit 1
          fi

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate project lint and build
        run: |
          npm run lint
          npm run build

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Validate release version ordering
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version_meta.outputs.version_name }}
          VERSION_CODE: ${{ steps.version_meta.outputs.version_code }}
        run: |
          set -euo pipefail
          node scripts/validate_release_version.mjs \
            --version-name "$VERSION_NAME" \
            --version-code "$VERSION_CODE" \
            --repo "$GITHUB_REPOSITORY"

      - name: Prepare release signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for required in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!required:-}" ]; then
              echo "Missing required GitHub secret: $required" >&2
              exit 1
            fi
          done

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release-keystore.jks
          cat > android/keystore.properties <<EOF
storeFile=release-keystore.jks
storePassword=$ANDROID_KEYSTORE_PASSWORD
keyAlias=$ANDROID_KEY_ALIAS
keyPassword=$ANDROID_KEY_PASSWORD
EOF

      - name: Sync Capacitor Android
        run: npx cap copy android

      - name: Build signed release APK
        working-directory: android
        env:
          APP_VERSION_NAME: ${{ steps.version_meta.outputs.version_name }}
          APP_VERSION_CODE: ${{ steps.version_meta.outputs.version_code }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease

      - name: Verify APK signature
        run: |
          set -euo pipefail
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Release APK was not generated at $APK_PATH" >&2
            exit 1
          fi
          apksigner verify --print-certs "$APK_PATH"

      - name: Generate update manifest
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version_meta.outputs.version_name }}
          VERSION_CODE: ${{ steps.version_meta.outputs.version_code }}
          TAG: ${{ steps.version_meta.outputs.tag }}
        run: |
          set -euo pipefail
          node scripts/release_manifest.mjs \
            --version-name "$VERSION_NAME" \
            --version-code "$VERSION_CODE" \
            --tag "$TAG" \
            --repo "$GITHUB_REPOSITORY"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version_meta.outputs.tag }}
          VERSION_NAME: ${{ steps.version_meta.outputs.version_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; reusing it."
          else
            gh release create "$TAG" "$TAG" --title "NOVA v$VERSION_NAME" --generate-notes
          fi

      - name: Upload release assets
        shell: bash
        env:
          TAG: ${{ steps.version_meta.outputs.tag }}
          VERSION_NAME: ${{ steps.version_meta.outputs.version_name }}
        run: |
          set -euo pipefail
          cp "android/app/build/outputs/apk/release/app-release.apk" "NOVA-v${VERSION_NAME}.apk"
          gh release upload "$TAG" "NOVA-v${VERSION_NAME}.apk" "nova-update-manifest.json" --clobber

      - name: Upload build logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-release-artifacts
          path: |
            android/app/build/reports
            android/app/build/outputs/apk/release
            nova-update-manifest.json
          if-no-files-found: ignore
